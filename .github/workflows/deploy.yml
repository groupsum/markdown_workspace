name: deploy-production
on:
  workflow_dispatch:
    inputs:
      confirmation: {description: Type DEPLOY markdown-workspace vm104., required: true, type: string}
      repair_certificate_ownership: {description: Adopt a compatible unmanaged certificate before planning., required: false, default: false, type: boolean}
permissions: {actions: read, contents: read}
concurrency: {group: deploy-markdown-workspace-vm104, cancel-in-progress: false}
env:
  COMPOSE_PROJECT: markdown-workspace
  OWNER: markdown-workspace
  PORTWYRM_NETWORK: portwyrm-edge
  WYRMCTL_CREDENTIAL: /etc/groupsum/portwyrm.env
  DESIRED_STATE: .wyrmctl/desired-state/production/desired-state.yaml
jobs:
  repair-certificate-ownership:
    if: ${{ inputs.confirmation == 'DEPLOY markdown-workspace vm104' && inputs.repair_certificate_ownership }}
    runs-on: {group: portwyrm-deployment, labels: [self-hosted, Linux, X64, vm104]}
    environment: deployment
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: cobycloud/actions/actions/wyrmctl-setup@4733b1d73417b6ce5f43c8993675225ba395aeee
      - name: Adopt compatible certificate ownership metadata
        run: |
          set -euo pipefail
          test -r "$WYRMCTL_CREDENTIAL"
          base_url="$(sed -n 's/^PORTWYRM_WYRMCTL_BASE_URL=//p' "$WYRMCTL_CREDENTIAL")"
          identity="$(sed -n 's/^PORTWYRM_WYRMCTL_IDENTITY=//p' "$WYRMCTL_CREDENTIAL")"
          secret="$(sed -n 's/^PORTWYRM_WYRMCTL_SECRET_B64=//p' "$WYRMCTL_CREDENTIAL" | base64 -d)"
          echo "::add-mask::$secret"; test "$identity" = jacob@swarmauri.com
          NPM_BASE_URL="$base_url" NPM_IDENTITY="$identity" NPM_SECRET="$secret" \
            wyrmctl --output json adopt "$DESIRED_STATE" \
              --owner "$OWNER" \
              --metadata-only \
              --only certificates \
              --certificate-mode reuse \
              --validate-output

  plan:
    needs: repair-certificate-ownership
    if: ${{ always() && inputs.confirmation == 'DEPLOY markdown-workspace vm104' && (needs.repair-certificate-ownership.result == 'success' || needs.repair-certificate-ownership.result == 'skipped') }}
    runs-on: {group: portwyrm-deployment, labels: [self-hosted, Linux, X64, vm104]}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: cobycloud/actions/actions/wyrmctl-setup@4733b1d73417b6ce5f43c8993675225ba395aeee
      - name: Validate isolated deployment definition
        run: |
          set -euo pipefail
          ! grep -R -E 'dockerwp|portwyrm_frontend' docker-compose.yml "$DESIRED_STATE"
          docker compose --project-name "$COMPOSE_PROJECT" config --quiet
          wyrmctl validate "$DESIRED_STATE"
          docker network inspect "$PORTWYRM_NETWORK" >/dev/null
          mkdir -p deployment-evidence
      - id: portwyrm
        name: Load protected Portwyrm automation identity
        run: |
          set -euo pipefail
          test -r "$WYRMCTL_CREDENTIAL"
          base_url="$(sed -n 's/^PORTWYRM_WYRMCTL_BASE_URL=//p' "$WYRMCTL_CREDENTIAL")"
          identity="$(sed -n 's/^PORTWYRM_WYRMCTL_IDENTITY=//p' "$WYRMCTL_CREDENTIAL")"
          secret="$(sed -n 's/^PORTWYRM_WYRMCTL_SECRET_B64=//p' "$WYRMCTL_CREDENTIAL" | base64 -d)"
          echo "::add-mask::$secret"; test "$identity" = jacob@swarmauri.com
          echo "base-url=$base_url" >> "$GITHUB_OUTPUT"; echo "identity=$identity" >> "$GITHUB_OUTPUT"; echo "secret=$secret" >> "$GITHUB_OUTPUT"
      - uses: cobycloud/actions/actions/wyrmctl-plan@56c4a13434c7ec49453bf109d7d6955158992b5a
        with:
          desired-state: ${{ env.DESIRED_STATE }}
          owner: ${{ env.OWNER }}
          artifact-out: deployment-evidence/wyrmctl-plan.json
          repository: ${{ github.repository }}
          environment: production
          commit: ${{ github.sha }}
          base-url: ${{ steps.portwyrm.outputs.base-url }}
          identity: ${{ steps.portwyrm.outputs.identity }}
          secret: ${{ steps.portwyrm.outputs.secret }}
          certificate-mode: create
      - run: sha256sum deployment-evidence/wyrmctl-plan.json | tee deployment-evidence/plan.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-plan-${{ github.sha }}
          path: deployment-evidence
          if-no-files-found: error
          retention-days: 14
  apply:
    needs: plan
    runs-on: {group: portwyrm-deployment, labels: [self-hosted, Linux, X64, vm104]}
    environment: deployment
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: cobycloud/actions/actions/wyrmctl-setup@4733b1d73417b6ce5f43c8993675225ba395aeee
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployment-plan-${{ github.sha }}
          path: deployment-evidence
      - id: portwyrm
        name: Verify reviewed plan and load automation identity
        run: |
          set -euo pipefail; sha256sum --check deployment-evidence/plan.sha256
          base_url="$(sed -n 's/^PORTWYRM_WYRMCTL_BASE_URL=//p' "$WYRMCTL_CREDENTIAL")"; identity="$(sed -n 's/^PORTWYRM_WYRMCTL_IDENTITY=//p' "$WYRMCTL_CREDENTIAL")"; secret="$(sed -n 's/^PORTWYRM_WYRMCTL_SECRET_B64=//p' "$WYRMCTL_CREDENTIAL" | base64 -d)"
          echo "::add-mask::$secret"; test "$identity" = jacob@swarmauri.com
          echo "base-url=$base_url" >> "$GITHUB_OUTPUT"; echo "identity=$identity" >> "$GITHUB_OUTPUT"; echo "secret=$secret" >> "$GITHUB_OUTPUT"
      - uses: cobycloud/actions/actions/host-mutation-lock@56c4a13434c7ec49453bf109d7d6955158992b5a
        with: {operation: acquire, lock-name: vm104}
      - uses: cobycloud/actions/actions/docker-compose-stack@56c4a13434c7ec49453bf109d7d6955158992b5a
        with: {compose-file: docker-compose.yml, project-name: '${{ env.COMPOSE_PROJECT }}', operation: deploy}
      - uses: cobycloud/actions/actions/wyrmctl-apply@56c4a13434c7ec49453bf109d7d6955158992b5a
        with:
          artifact: deployment-evidence/wyrmctl-plan.json
          repository: ${{ github.repository }}
          environment: production
          commit: ${{ github.sha }}
          base-url: ${{ steps.portwyrm.outputs.base-url }}
          identity: ${{ steps.portwyrm.outputs.identity }}
          secret: ${{ steps.portwyrm.outputs.secret }}
          report: deployment-evidence/wyrmctl-apply.json
          audit-log: deployment-evidence/wyrmctl-audit.json
          rollback-plan: deployment-evidence/wyrmctl-rollback.json
      - run: docker compose --project-name "$COMPOSE_PROJECT" ps
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-deploy-${{ github.sha }}
          path: deployment-evidence
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        uses: cobycloud/actions/actions/host-mutation-lock@56c4a13434c7ec49453bf109d7d6955158992b5a
        with: {operation: release, lock-name: vm104}
